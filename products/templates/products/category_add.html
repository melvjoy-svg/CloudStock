{% extends 'base.html' %}
{% block title %}Add Category | CloudStock{% endblock %}
{% block page_title %}Add Category{% endblock %}
{% block content %}
<div class="form-card">
    <form method="POST" class="styled-form">
        {% csrf_token %}

        <div class="form-grid two-column">
            <div class="field-group">
                <label>Tenant</label>
                <select name="tenant" required>
                    <option value="">Select Tenant</option>
                    {% for tenant in tenants %}
                        <option value="{{ tenant.id }}">{{ tenant.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field-group">
                <label>Category Name</label>
                <input type="text" name="name" required>
            </div>
        </div>

        <div class="field-group">
            <label>Description</label>
            <textarea name="description" rows="4"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn">Add Category</button>
            <a href="{% url 'category_list' %}" class="secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
