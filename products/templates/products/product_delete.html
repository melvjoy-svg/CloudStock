{% extends 'base.html' %}
{% block title %}Delete Product | CloudStock{% endblock %}
{% block page_title %}Delete Product{% endblock %}
{% block content %}
<div class="form-card confirm-card">
    <p class="confirm-text">Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>

    <form method="POST" class="styled-form">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="primary-btn danger-btn">Yes, Delete</button>
            <a href="{% url 'product_list' %}" class="secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
