{% extends 'base.html' %}
{% block title %}Edit Category | CloudStock{% endblock %}
{% block page_title %}Edit Category{% endblock %}
{% block content %}
<div class="form-card">
    <form method="POST" class="styled-form">
        {% csrf_token %}

        <div class="field-group">
            <label>Category Name</label>
            <input type="text" name="name" value="{{ category.name }}" required>
        </div>

        <div class="field-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ category.description }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn">Update Category</button>
            <a href="{% url 'category_list' %}" class="secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
