{% extends 'base.html' %}
{% block title %}Edit Product | CloudStock{% endblock %}
{% block page_title %}Edit Product{% endblock %}
{% block content %}
<div class="form-card">
    <form method="POST" class="styled-form">{% csrf_token %}
        <div class="form-grid two-column">
            <div class="field-group"><label>Category</label><select name="category"><option value="">No Category</option>{% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div>
            <div class="field-group"><label>Product Name</label><input type="text" name="name" value="{{ product.name }}" required></div>
            <div class="field-group"><label>SKU</label><input type="text" name="sku" value="{{ product.sku }}" required></div>
            <div class="field-group"><label>Selling Price</label><input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required></div>
            <div class="field-group"><label>Cost Price</label><input type="number" step="0.01" min="0" name="cost_price" value="{{ product.cost_price }}" required></div>
            <div class="field-group"><label>Current Stock</label><input type="number" value="{{ product.stock_quantity }}" readonly></div>
            <div class="field-group"><label>Reorder Level</label><input type="number" min="0" name="reorder_level" value="{{ product.reorder_level }}" required></div>
        </div>
        <div class="field-group"><label>Description</label><textarea name="description" rows="4">{{ product.description }}</textarea></div>
        <p class="muted-text">Stock changes are recorded through Purchases and Sales.</p>
        <div class="form-actions"><button type="submit" class="primary-btn">Update Product</button><a href="{% url 'product_list' %}" class="secondary-btn">Cancel</a></div>
    </form>
</div>
{% endblock %}
