{% extends 'base.html' %}
{% block title %}Add Product | CloudStock{% endblock %}
{% block page_title %}Add Product{% endblock %}
{% block content %}
<div class="form-card">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST" enctype="multipart/form-data" class="styled-form">{% csrf_token %}
        <div class="form-grid two-column">
            {% if request.user.role == 'SUPER_ADMIN' %}
            <div class="field-group">
                <label>Tenant</label>
                <select name="tenant" required>
                    <option value="">Select Tenant</option>
                    {% for tenant in tenants %}<option value="{{ tenant.id }}">{{ tenant.name }}</option>{% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="field-group">
                <label>Category</label>
                <select name="category">
                    <option value="">No Category</option>
                    {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="field-group"><label>Product Name</label><input type="text" name="name" required></div>
            <div class="field-group"><label>SKU</label><input type="text" name="sku" required></div>
            <div class="field-group"><label>Selling Price</label><input type="number" step="0.01" min="0" name="price" required></div>
            <div class="field-group"><label>Cost Price</label><input type="number" step="0.01" min="0" name="cost_price" required></div>
            <div class="field-group"><label>Opening Stock</label><input type="number" min="0" name="stock_quantity" value="0" required></div>
            <div class="field-group"><label>Reorder Level</label><input type="number" min="0" name="reorder_level" value="0" required></div>
        </div>
        <div class="field-group"><label>Description</label><textarea name="description" rows="4"></textarea></div>
        <div class="field-group"><label>Product Image</label><input type="file" name="image" accept="image/*"></div>
        <div class="form-actions"><button type="submit" class="primary-btn">Add Product</button><a href="{% url 'product_list' %}" class="secondary-btn">Cancel</a></div>
    </form>
</div>
{% endblock %}
