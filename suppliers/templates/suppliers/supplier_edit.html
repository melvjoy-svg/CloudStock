{% extends 'base.html' %}
{% block title %}Edit Supplier | CloudStock{% endblock %}
{% block page_title %}Edit Supplier{% endblock %}
{% block content %}
<div class="form-card">
    <form method="POST" class="styled-form">
        {% csrf_token %}

        <div class="form-grid two-column">
            <div class="field-group">
                <label>Supplier Name</label>
                <input type="text" name="name" value="{{ supplier.name }}" required>
            </div>

            <div class="field-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ supplier.phone }}" required>
            </div>

            <div class="field-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ supplier.email }}">
            </div>
        </div>

        <div class="field-group">
            <label>Address</label>
            <textarea name="address" rows="4">{{ supplier.address }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn">Update Supplier</button>
            <a href="{% url 'supplier_list' %}" class="secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
