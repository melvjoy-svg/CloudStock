<!DOCTYPE html>
<html>

<head>
    <title>Delete Tenant - CloudStock</title>
</head>

<body>

    <h1>Delete Tenant</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ tenant.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'tenant_list' %}">
            Cancel
        </a>
    </form>

</body>

</html>
