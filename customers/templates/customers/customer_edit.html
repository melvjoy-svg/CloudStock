{% extends 'base.html' %}
{% block title %}Edit Customer | CloudStock{% endblock %}
{% block page_title %}Edit Customer{% endblock %}
{% block content %}
<div class="form-card">
    <form method="POST" class="styled-form">
        {% csrf_token %}

        <div class="form-grid two-column">
            <div class="field-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ customer.name }}" required>
            </div>

            <div class="field-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ customer.phone }}" required>
            </div>

            <div class="field-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ customer.email }}">
            </div>
        </div>

        <div class="field-group">
            <label>Address</label>
            <textarea name="address" rows="4">{{ customer.address }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn">Update Customer</button>
            <a href="{% url 'customer_list' %}" class="secondary-btn">Back</a>
        </div>
    </form>
</div>
{% endblock %}
